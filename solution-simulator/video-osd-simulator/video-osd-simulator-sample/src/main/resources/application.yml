server:
  port: 18083

spring:
  application:
    name: video-osd-simulator
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:video-osd-simulator;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql
      data-locations: classpath:sql/data-h2.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

simulator:
  ffmpeg:
    path: ffmpeg
    input-patterns: "*.mp4,*.flv,*.mov,*.mkv"
  osd:
    websocket-endpoint: ws://127.0.0.1:18083/osd
    fixed-interval-millis: 1000
    publish-time-start:
    publish-time-end:
  video:
    source-directory: ./sample-videos
    source-file:
  zlm:
    host: 127.0.0.1
    rtmp-port: 7935
    rtsp-port: 8554
    rtc-port: 10000
    app: live
    stream: drone001
  webrtc:
    push-command-template: webrtc-pusher --input "{videoFile}" --host {zlmHost} --app {app} --stream {stream}
